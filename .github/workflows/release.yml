# Builds BaoCode for macOS, Windows (x64, arm64) and Linux and uploads the
# packages to a GitHub Release. docs/release.md has versions and how a tag starts this.
#
#   git tag v1.2.0 && git push origin v1.2.0   build and upload 1.2.0
#   Actions → Release → Run workflow           build only, to try the build
#
# A version may be uploaded again (the tag moved to a fixed commit): the
# GitHub Release for that tag is replaced.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; one that started is never cancelled halfway
# through its upload.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      marketing: ${{ steps.version.outputs.marketing }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Read pubspec.yaml's version, and match the tag against it
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          marketing=${version%%+*}
          code=$(sed -n "s/^const appVersionString = '\(.*\)';/\1/p" lib/update/version.dart)
          echo "pubspec.yaml: $version, lib/update/version.dart: $code"
          if [ "$version" != "$code" ]; then
            echo "::error::lib/update/version.dart says $code, pubspec.yaml $version: run tool/bump_version.dart"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::$version is not x.y.z+build"
            exit 1
          fi
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$marketing" ]; then
              echo "::error::Tag $GITHUB_REF_NAME, but pubspec.yaml is $version: the tag has to be v$marketing"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "marketing=$marketing"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Be no older than the version published
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Compare against this repository's update channel, not upstream.
          published=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" | jq -r '.version // empty' || true)
          echo "Published: ${published:-none}, this: $VERSION"
          [ -z "$published" ] && exit 0
          # x.y.z+build, compared number by number.
          python3 - "$published" "$VERSION" <<'EOF'
          import re, sys
          def key(v):
              m = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+(\d+))?', v)
              return tuple(int(x or 0) for x in m.groups())
          published, this = sys.argv[1:]
          if key(this) < key(published):
              sys.exit(f'::error::{this} is older than {published}, which is published: installed apps would not take it')
          if key(this) == key(published):
              print(f'::warning::{this} is published already: publishing it again')
          EOF

  remote:
    name: Build the remote server
    needs: check
    # A Mac, as only one builds for macOS: the Linux builds are
    # cross-compiled, the macOS x64 one by an x64 Dart SDK under Rosetta.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get the x64 Dart SDK of Flutter's version
        run: |
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          version=$(dart --version 2>&1 | sed -n 's/^Dart SDK version: \([^ ]*\) (\([a-z]*\)).*/\1 \2/p')
          read -r dart channel <<< "$version"
          echo "Dart $dart ($channel)"
          curl -fsSL -o "$RUNNER_TEMP/dart-x64.zip" \
            "https://storage.googleapis.com/dart-archive/channels/$channel/release/$dart/sdk/dartsdk-macos-x64-release.zip"
          unzip -q "$RUNNER_TEMP/dart-x64.zip" -d "$RUNNER_TEMP/dart-x64"
          "$RUNNER_TEMP/dart-x64/dart-sdk/bin/dart" --version
      # Once, for both apps: they carry its servers.json, and download the
      # build a host needs from this GitHub Release (docs/ssh-remote.md, 9.3).
      - name: Build for Linux and macOS, x64 and arm64
        run: |
          dart run tool/build_remote_server.dart --out build/remote --all \
            --macos-x64-dart "$RUNNER_TEMP/dart-x64/dart-sdk/bin/dart"
      - name: Run the macOS builds here
        run: tool/test_remote_server_macos.sh build/remote
      - uses: actions/upload-artifact@v4
        with:
          name: remote
          if-no-files-found: error
          path: |
            build/remote/VERSION
            build/remote/servers.json
            build/remote/*.gz
      - uses: actions/upload-artifact@v4
        with:
          name: remote-linux
          if-no-files-found: error
          path: |
            build/remote/VERSION
            build/remote/baocode-server-linux-*
            !build/remote/*.gz

  remote-linux:
    name: Run the remote server on Linux
    needs: remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: remote-linux
          path: build/remote
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Run it on Linux distributions, in Docker
        run: |
          # Artifacts keep no modes.
          chmod 755 build/remote/baocode-server-linux-*
          tool/test_remote_server.sh build/remote

  macos:
    name: Build for macOS
    needs: [check, remote]
    runs-on: macos-15
    # The Developer ID certificate and the notary key are the release
    # environment's secrets, for tags only. Without them (a build only, or
    # before they are set) the app is signed ad hoc, and only opens on the
    # machine that built it.
    environment: ${{ needs.check.outputs.publish == 'true' && 'release' || '' }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Put the Developer ID certificate in a keychain
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Put the notary key in a file
        if: env.NOTARY_KEY != ''
        run: |
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "BAOCODE_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: remote
          path: build/remote
      - name: Install create-dmg
        run: brew install create-dmg
      # bao_iroh's Rust (the phones' link), built by its build hook.
      - uses: ./.github/actions/setup-rust
      - name: Build, sign and notarise
        env:
          BAOCODE_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          BAOCODE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          BAOCODE_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: dart run tool/build_macos.dart --remote-built
      - name: Launch each app, as an update installs it
        run: |
          # A valid signature is not enough: dyld can still refuse to load
          # the app's frameworks (as with the hardened runtime ad hoc). The
          # Intel one runs under Rosetta here.
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          for arch in arm64 x64; do
            dir="$RUNNER_TEMP/launch-$arch"
            mkdir "$dir"
            ditto -x -k build/installers/BaoCode-*-mac-$arch.zip "$dir"
            BAOCODE_DATA_DIR="$dir-data" \
              "$dir/BaoCode.app/Contents/MacOS/BaoCode" > "$dir.log" 2>&1 &
            pid=$!
            sleep 15
            if ! kill -0 $pid 2>/dev/null; then
              cat "$dir.log"
              echo "::error::BaoCode ($arch) exited within 15 seconds of launch"
              exit 1
            fi
            echo "BaoCode ($arch) is running after 15 seconds"
            kill $pid
          done
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          if-no-files-found: error
          path: |
            build/installers/BaoCode-*.dmg
            build/installers/BaoCode-*-mac-*.zip
      # The Dart code's symbols, for a jank sample's `??? (in App)` frames
      # (tool/build_macos.dart). Not released: kept with the run.
      - uses: actions/upload-artifact@v6
        with:
          name: symbols-macos
          if-no-files-found: error
          retention-days: 90
          path: build/symbols/App.macos.symbols
      - name: Forget the certificate and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # x64, and arm64 on an Arm runner: flutter builds for the machine it
  # runs on alone.
  windows:
    name: Build for Windows (${{ matrix.arch }})
    needs: [check, remote]
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing leaves the other building, to be re-run alone.
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      # The x64 installer's name has no arch, as it always had.
      ARCH_SUFFIX: ${{ matrix.arch == 'arm64' && '-arm64' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Flutter's Windows SDK archive carries an x64 Dart; cloned at the
      # release's tag, it downloads the Arm one for this machine.
      - name: Clone Flutter
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
          # The engine's artifacts and packages (sky_engine), for pub.
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" precache --windows
      - name: Install Inno Setup
        if: matrix.arch == 'x64'
        run: choco install innosetup --no-progress -y
      # Its installer itself, where Chocolatey may not be (the Arm image).
      - name: Install Inno Setup
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $is = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $is
          if ((Get-FileHash $is -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'innosetup-6.7.3.exe: wrong SHA-256' }
          $setup = Start-Process $is -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Inno Setup's installer exited with $($setup.ExitCode)" }
      - uses: actions/download-artifact@v7
        with:
          name: remote
          path: build/remote
      # bao_iroh's Rust (the phones' link), built by its build hook.
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: dart run tool/build_windows.dart --remote-built --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          if-no-files-found: error
          path: build/installers/BaoCode-*-setup${{ env.ARCH_SUFFIX }}.exe
      # The Dart code's symbols, for a hang report's app.so+0x… frames
      # (tool/build_windows.dart). Not released: kept with the run.
      - uses: actions/upload-artifact@v6
        with:
          name: symbols-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90
          path: build/symbols/app.windows-${{ matrix.arch }}.symbols

  linux:
    name: Build for Linux (${{ matrix.arch }}, ${{ matrix.edition }})
    needs: [check, remote]
    # The oldest Ubuntu built on: its glibc and GTK are what the package
    # runs on from there up.
    runs-on: ${{ matrix.runner }}
    strategy:
      # One edition failing leaves the other building, to be re-run alone.
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        edition: [standard]
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    env:
      SUFFIX: ${{ matrix.edition == 'channel' && '-channel' || '' }}
      # The channel build's login window is WebKitGTK's
      # (linux/runner/CMakeLists.txt).
      BAOCODE_CHANNEL: ${{ matrix.edition == 'channel' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Flutter publishes no SDK archive for Linux on arm64, so there it is
      # cloned at the release's tag; the engine it downloads has arm64 builds.
      - name: Clone Flutter
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Install GTK's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev xvfb dbus-x11
          if [ "$BAOCODE_CHANNEL" = true ]; then
            sudo apt-get install -y libwebkit2gtk-4.1-dev
          fi
      - uses: actions/download-artifact@v7
        with:
          name: remote
          path: build/remote
      # bao_iroh's Rust (the phones' link), built by its build hook.
      - uses: ./.github/actions/setup-rust
      # The Dart code's symbols are saved beside it, for a jank sample's
      # libapp.so+0x… frames (tool/symbolize_jank_sample.dart). Only saved:
      # libapp.so stays as it was.
      - name: Build
        run: |
          mkdir -p build/symbols
          flutter build linux --release \
            "--extra-gen-snapshot-options=--save-debugging-info=$PWD/build/symbols/app.linux-${{ matrix.arch }}.symbols" \
            ${{ matrix.edition == 'channel' && '--dart-define=BAOCODE_CHANNEL=true' || '' }}
      - name: Package the .deb and the tarball
        run: |
          sh tool/package_linux_deb.sh ${{ matrix.edition == 'channel' && '--channel' || '' }}
          dpkg-deb --info build/installers/BaoCode-*.deb
          # The phones' link (bao_iroh's Rust) is in it.
          dpkg-deb --contents build/installers/BaoCode-*.deb | grep -q 'lib/libbao_iroh.so$'
      - name: Install the package and launch it
        run: |
          sudo apt-get install -y ./build/installers/BaoCode-*.deb
          log="$RUNNER_TEMP/launch.log"
          # A browser's folder, for the host's manifest to be written in; the
          # socket in a runtime folder of the user's alone, as on a desktop.
          mkdir -p "$HOME/.config/google-chrome"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          # One that does not exist is asked about, and the app waits there.
          mkdir "$RUNNER_TEMP/launch-data"
          BAOCODE_DATA_DIR="$RUNNER_TEMP/launch-data" \
            dbus-run-session -- xvfb-run -a /opt/baocode/baocode > "$log" 2>&1 &
          sleep 15
          if ! pgrep -x baocode > /dev/null; then
            cat "$log"
            echo "::error::BaoCode exited within 15 seconds of launch"
            exit 1
          fi
          echo "BaoCode is running after 15 seconds"
          # The browser extension's host: where the manifest says, and
          # reaching the BaoCode running.
          manifest="$HOME/.config/google-chrome/NativeMessagingHosts/dev.baocode.browser.json"
          cat "$manifest"
          grep -q '"path": "/opt/baocode/baocode-browser-host"' "$manifest"
          python3 - << 'EOF'
          import json, signal, struct, subprocess
          signal.alarm(10)
          host = subprocess.Popen(
              ["/opt/baocode/baocode-browser-host",
               "chrome-extension://jfjagocghaaheooicmdnhcholmgdkngk/"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          while True:
              n = struct.unpack("<I", host.stdout.read(4))[0]
              said = json.loads(host.stdout.read(n))
              print("host said", said)
              if said == {"type": "bridge", "connected": True}:
                  break
          host.stdin.close()
          host.wait()
          EOF
          pkill -x baocode || true
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/installers/BaoCode-*.deb
            build/installers/BaoCode-*.tar.gz
      # Not released: kept with the run.
      - uses: actions/upload-artifact@v6
        with:
          name: symbols-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 90
          path: build/symbols/app.linux-${{ matrix.arch }}.symbols

  publish:
    name: Upload the packages to GitHub
    needs: [check, remote, remote-linux, macos, windows, linux]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MARKETING: ${{ needs.check.outputs.marketing }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Gather the packages
        run: |
          mkdir -p out
          for arch in arm64 x64; do
            cp dist/macos/BaoCode-$MARKETING-$arch.dmg dist/macos/BaoCode-$MARKETING-mac-$arch.zip out/
          done
          cp dist/windows-x64/BaoCode-$MARKETING-setup.exe \
            dist/windows-arm64/BaoCode-$MARKETING-setup-arm64.exe out/
          cp dist/linux-*/*.deb dist/linux-*/*.tar.gz out/
          # The remote server builds the app downloads the first time a
          # host of that platform connects.
          cp dist/remote/*.gz out/
          find out -type f -printf '%f\n' | sort
      - name: Write latest.json
        run: |
          flutter pub get
          notes=()
          for language in en zh; do
            file="release-notes/$MARKETING.$language.md"
            if [ -f "$file" ]; then
              notes+=(--notes-$language "$file")
            fi
          done
          dart run tool/release_manifest.dart \
            --version "$VERSION" \
            --windows out/BaoCode-$MARKETING-setup.exe \
            --windows-arm64 out/BaoCode-$MARKETING-setup-arm64.exe \
            --macos-arm64 out/BaoCode-$MARKETING-mac-arm64.zip \
            --macos-x64 out/BaoCode-$MARKETING-mac-x64.zip \
            --dmg-arm64 out/BaoCode-$MARKETING-arm64.dmg \
            --dmg-x64 out/BaoCode-$MARKETING-x64.dmg \
            --linux-x64 out/BaoCode-$MARKETING-linux-amd64.deb \
            --linux-arm64 out/BaoCode-$MARKETING-linux-arm64.deb \
            --manifest out/latest.json \
            "${notes[@]}"
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          [ -f "release-notes/$MARKETING.en.md" ] && notes=(--notes-file "release-notes/$MARKETING.en.md")
          # Uploaded again: the release is made anew, on the tag's commit.
          # Do not pass --cleanup-tag: that would delete the tag that
          # started this run.
          gh release delete "v$MARKETING" --yes 2>/dev/null || true
          gh release create "v$MARKETING" --title "BaoCode $MARKETING" "${notes[@]}" \
            out/latest.json \
            out/BaoCode-$MARKETING-arm64.dmg \
            out/BaoCode-$MARKETING-x64.dmg \
            out/BaoCode-$MARKETING-mac-arm64.zip \
            out/BaoCode-$MARKETING-mac-x64.zip \
            out/BaoCode-$MARKETING-setup.exe \
            out/BaoCode-$MARKETING-setup-arm64.exe \
            out/BaoCode-$MARKETING-linux-*.deb \
            out/BaoCode-$MARKETING-linux-*.tar.gz \
            out/baocode-server-linux-x64.gz \
            out/baocode-server-linux-arm64.gz \
            out/baocode-server-darwin-x64.gz \
            out/baocode-server-darwin-arm64.gz
